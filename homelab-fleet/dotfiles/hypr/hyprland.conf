# =============================================================================
# hyprland.conf — top-level Hyprland config (PLAINTEXT, hot-editable).
# =============================================================================
#
# This file and its includes are symlinked into ~/.config/hypr via
# mkOutOfStoreSymlink (see modules/home-manager/hyprland.nix, ROUTE 1). That
# means you can edit these files in the repo and run `hyprctl reload` to apply
# instantly — NO nixos-rebuild needed. Great for iterating on your rice.
#
# Organization mirrors omarchy's split (bindings / look-and-feel / rules) so
# each concern lives in its own file:
#   colors.conf     -> GENERATED by Nix from the active theme (theme.nix)
#   looknfeel.conf  -> gaps, borders, blur, animations, input
#   keybinds.conf   -> the default keymap
#   rules.conf      -> window/workspace rules

# Generated palette ($base00, $accent, $activeBorder, ...). Written by
# modules/home-manager/theme.nix from themes/<active>.nix.
source = ~/.config/hypr/colors.conf

# The rest of the config, split by concern.
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf

###################
### MY PROGRAMS ###
###################
# Referenced by keybinds.conf. Change these to swap your default apps.
$terminal = kitty
$fileManager = yazi
$menu = wofi --show drun
$browser = firefox

#################
### MONITORS  ###
#################
# Default: let Hyprland auto-detect. To pin monitors declaratively instead,
# set `fleet.monitors` in your host and switch to ROUTE 2 in hyprland.nix,
# or just add explicit `monitor=` lines here (this file is hot-editable):
monitor = , preferred, auto, 1
# Example for rocinante's setup (edit to taste):
# monitor = DP-1, 2560x1440@144, 0x0, 1

#################
### AUTOSTART ###
#################
# swaync = notifications, waybar = bar, hyprpaper = wallpaper.
exec-once = swaync
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
# AMD (rocinante): prefer RADV (also set at system level in gpu-amd.nix).
env = AMD_VULKAN_ICD,RADV
