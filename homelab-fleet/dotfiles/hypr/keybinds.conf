# =============================================================================
# keybinds.conf — the DEFAULT KEYMAP (PLAINTEXT, hot-editable).
# =============================================================================
#
# SUPER is the main modifier ("Windows" key). This is a sensible, well-commented
# starting keymap in the spirit of tonybanters/omarchy defaults. Edit freely and
# `hyprctl reload`.
#
# Syntax: bind = MODS, KEY, DISPATCHER, ARGS
#   See https://wiki.hyprland.org/Configuring/Binds/

$mod = SUPER

# --- Core apps ---------------------------------------------------------------
bind = $mod, Return, exec, $terminal          # open terminal
bind = $mod, Q, killactive,                    # close focused window
bind = $mod, E, exec, $terminal -e $fileManager# file manager (yazi in a terminal)
bind = $mod, D, exec, $menu                    # app launcher (wofi)
bind = $mod, B, exec, $browser                 # browser
bind = $mod SHIFT, Q, exit,                    # exit Hyprland (log out)

# --- Window management -------------------------------------------------------
bind = $mod, V, togglefloating,                # toggle floating
bind = $mod, P, pseudo,                        # dwindle pseudotile
bind = $mod, J, togglesplit,                   # dwindle split direction
bind = $mod, F, fullscreen,                    # fullscreen

# Move focus (vim-style hjkl).
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move the focused window (SHIFT + hjkl).
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# --- Workspaces --------------------------------------------------------------
# Switch to workspace N.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move focused window to workspace N (SHIFT).
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces with SUPER + mouse wheel.
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize with SUPER + drag.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Utilities ---------------------------------------------------------------
bind = $mod, L, exec, hyprlock                 # lock screen
# Region screenshot to clipboard (grim + slurp).
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
# Full screenshot to clipboard.
bind = SHIFT, Print, exec, grim - | wl-copy

# --- Media / brightness (laptop-friendly; harmless on desktop) ---------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
