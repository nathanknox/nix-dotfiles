# matugen TEMPLATE (Route B). Rendered to ~/.config/hypr/colors.conf.
# {{colors.*}} placeholders are filled by matugen from the wallpaper palette.
# Compare with the Route A output in modules/home-manager/theme.nix.
$base00 = rgb({{colors.surface.default.hex_stripped}})
$base05 = rgb({{colors.on_surface.default.hex_stripped}})
$accent = rgb({{colors.primary.default.hex_stripped}})
$activeBorder   = rgba({{colors.primary.default.hex_stripped}}ee) rgba({{colors.tertiary.default.hex_stripped}}ee) 45deg
$inactiveBorder = rgba({{colors.outline.default.hex_stripped}}aa)
