# =============================================================================
# rules.conf — window & workspace rules (PLAINTEXT, hot-editable).
# =============================================================================
#
# windowrulev2 syntax: windowrulev2 = RULE, MATCHERS
#   See https://wiki.hyprland.org/Configuring/Window-Rules/

# Recommended default: suppress spurious maximize events from misbehaving apps.
windowrulev2 = suppressevent maximize, class:.*

# Float common transient dialogs.
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float, title:^(Open File)(.*)$
windowrulev2 = float, title:^(Save File)(.*)$

# Picture-in-picture: float + pin so it stays on top across workspaces.
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin,   title:^(Picture-in-Picture)$

# Example: send the browser to workspace 2 and Steam to workspace 4.
# windowrulev2 = workspace 2, class:^(firefox)$
# windowrulev2 = workspace 4 silent, class:^(steam)$

# Gaming: allow tearing for lower latency in fullscreen games (pairs with
# `allow_tearing` if you enable it in looknfeel general{}). Uncomment to use.
# windowrulev2 = immediate, class:^(steam_app_.*)$
