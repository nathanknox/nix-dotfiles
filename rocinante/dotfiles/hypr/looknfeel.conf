# =============================================================================
# looknfeel.conf — appearance + input (PLAINTEXT, hot-editable).
# =============================================================================
#
# Border/accent COLORS come from colors.conf ($activeBorder, $inactiveBorder),
# which Nix generates from the active theme. Everything else (gaps, rounding,
# blur, animations, input) is hand-tunable here. Edit + `hyprctl reload`.

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $activeBorder
    col.inactive_border = $inactiveBorder
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10                 # rounded corners (bump for a softer look)
    active_opacity = 1.0
    inactive_opacity = 0.95
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, ease
    animation = windowsOut, 1, 6, ease, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, ease
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0   # no anime mascot
    disable_hyprland_logo = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0               # -1.0 .. 1.0 (0 = no accel change)
    repeat_rate = 35
    repeat_delay = 250
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true        # 3-finger workspace swipe on touchpads
}
